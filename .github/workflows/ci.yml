name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [macos-15]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Lint
      run: |
        scripts/lint.sh

  test:
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    permissions:
      contents: read
    strategy:
      matrix:
        os: [macos-15]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Fingerprint native build toolchain
      id: native-toolchain
      shell: bash
      run: |
        set -euo pipefail
        source scripts/lib.sh
        # Same probe/download test.sh runs; idempotent, so `xcrun metal` is
        # guaranteed usable here before we read its version.
        ensure_metal_toolchain
        ensure_uv
        py=$(uv python find 3.12)
        {
          xcrun -sdk macosx metal --version
          clang --version
          xcrun -sdk macosx --show-sdk-version
          "$py" -c 'import sys; print(sys.version)'
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-}"
          echo "MACOSX_DEPLOYMENT_TARGET=${MACOSX_DEPLOYMENT_TARGET:-}"
          # Only the pins that select compiled-against headers/ABIs.
          grep -E '"(mlx|nanobind)==' pyproject.toml
        } | tee /dev/stderr | shasum -a 256 | cut -c1-16 > "$RUNNER_TEMP/tc"
        echo "hash=$(cat "$RUNNER_TEMP/tc")" >> "$GITHUB_OUTPUT"

    - name: Restore cached native build artifacts
      uses: actions/cache@v4
      with:
        # Artifacts travel with their .sha256 stamps (digests of build
        # inputs, not checksums of the artifacts); the build recompiles
        # anything whose stamp no longer matches the current sources.
        # Compiler/SDK compatibility relies on two layers: the toolchain
        # fingerprint in this key (metal/clang/SDK/Python versions, Xcode
        # pin, deployment target, mlx/nanobind pins) and, for metallibs
        # only, the build-side .toolchain record. The .so stamps record no
        # compiler version, so for those the key is the only guard. The key
        # also hashes what the stamps digest (Metal/C++ sources, shader
        # assembly, build.py/constants.py, the MPS launcher) and the vLLM
        # release tag (which pins torch).
        path: |
          vllm_metal/metal/*.metallib
          vllm_metal/metal/*.metallib.sha256
          vllm_metal/metal/*.metallib.toolchain
          vllm_metal/metal/_paged_ops*.so
          vllm_metal/metal/_paged_ops*.so.sha256
          vllm_metal/metal/_paged_ops.mlx-version
          vllm_metal/pytorch_backend/_mps_ops*.so
          vllm_metal/pytorch_backend/_mps_ops*.so.sha256
          vllm_metal/pytorch_backend/_mps_ops.torch-version
        key: >-
          native-${{ matrix.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.hash }}-${{ hashFiles(
          'vllm_metal/metal/build.py',
          'vllm_metal/metal/constants.py',
          'vllm_metal/metal/__init__.py',
          'vllm_metal/metal/*.cpp',
          'vllm_metal/metal/*.h',
          'vllm_metal/metal/kernels_v2/**',
          'vllm_metal/pytorch_backend/mps_ops.mm',
          '.github/vllm-release-tag.commit'
          ) }}

    - name: Test
      run: |
        scripts/test.sh
